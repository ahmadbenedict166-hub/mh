name: Reconstruct mh v5.7 source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reconstruct-v57.yml"

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source files
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          expected = {
              "index.html": "d9d877485bdfa5c6d9369150a1d65a71155d3ec27cb7b3b64b1aee6c1c6a8ee2",
              "styles.css": "a00efd0fcc88972cfb6005061976e87751eb2247cfa03d28939aaebcb4523573",
              "app.js": "5daa9e004bf138facf185d0ef0484720e5bb91a6cff24955d119117bf0700400",
          }

          root = Path(".parts")

          def reconstruct(name):
              exact = root / f"{name}.gz.b64"
              if exact.exists():
                  text = exact.read_text(encoding="ascii").strip()
              else:
                  parts = sorted(root.glob(f"{name}.gz.b64.*"))
                  if not parts:
                      raise FileNotFoundError(f"missing staged data for {name}")
                  text = "".join(p.read_text(encoding="ascii").strip() for p in parts)
              data = gzip.decompress(base64.b64decode(text))
              digest = hashlib.sha256(data).hexdigest()
              if digest != expected[name]:
                  raise RuntimeError(f"{name}: sha256 {digest} != {expected[name]}")
              Path(name).write_bytes(data)
              print(f"verified {name}: {digest}")

          for filename in expected:
              reconstruct(filename)
          PY

      - name: Publish clean source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .parts
          rm -f .github/workflows/reconstruct-v57.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish mh v5.7 Claude interaction refactor"
          git push origin HEAD:main
